<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Yatrip">
  <defs>
    <linearGradient id="ytFav" x1="4" y1="3" x2="44" y2="45" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFA272"/>
      <stop offset=".5" stop-color="#FF6B35"/>
      <stop offset="1" stop-color="#D94A18"/>
    </linearGradient>
    <linearGradient id="ytFavSheen" x1="24" y1="1" x2="24" y2="47" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".32"/>
      <stop offset=".55" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="46" height="46" rx="14" fill="url(#ytFav)"/>
  <rect x="1" y="1" width="46" height="46" rx="14" fill="url(#ytFavSheen)"/>

  <!-- dotted flight trail, tucked under the tail -->
  <path d="M8.5 42.5c0-5.2 3.1-8.4 7.2-10.4"
        fill="none" stroke="#fff" stroke-opacity=".55"
        stroke-width="2.4" stroke-linecap="round" stroke-dasharray="0.1 3.8"/>

  <!-- paper plane: Material 'send' geometry, scaled to fit -->
  <path d="M10 36.6 39.4 24 10 11.4v9.8l21 2.8-21 2.8z" fill="#fff"/>
</svg>
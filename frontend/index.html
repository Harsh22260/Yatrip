<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A1120" />

    <title>Yatrip — Explore India Your Way</title>
    <meta
      name="description"
      content="Book hotels, discover attractions and street food, plan routes and rent vehicles across India. One platform for hotels, food, attractions, transport and rentals, with an AI trip planner."
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="canonical" href="https://yatrip.example/" />

    <!-- Preconnect so the font request starts before the CSS is parsed. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Yatrip" />
    <meta property="og:title" content="Yatrip — Explore India Your Way" />
    <meta
      property="og:description"
      content="Hotels, food, attractions, transport and rentals across India — plus an AI trip planner that builds your itinerary."
    />
    <meta property="og:image" content="/images/hero/india.jpg" />
    <meta property="og:image:alt" content="The Taj Mahal at sunrise" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="842" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Yatrip — Explore India Your Way" />
    <meta
      name="twitter:description"
      content="Hotels, food, attractions, transport and rentals across India, with an AI trip planner."
    />
    <meta name="twitter:image" content="/images/hero/india.jpg" />

    <!-- The Leaflet bundle is injected by TransportPage; this makes sure the
         map tiles are prefetched on the one route that needs them. -->
    <link rel="preconnect" href="https://tile.openstreetmap.org" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      Yatrip needs JavaScript enabled. Please turn it on and reload the page.
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
